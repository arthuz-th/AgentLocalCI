name: Feature request
description: Propose a scoped, fail-closed enhancement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow gap without private repository details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Include configuration, execution boundary, cleanup, evidence, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Explain host, credential, network, provenance, and unrelated-resource risks.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and declared limitations
    validations:
      required: true
